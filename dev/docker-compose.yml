# Environnement de développement local : WordPress + MariaDB + WP-CLI, images officielles uniquement.
# Aucune image construite ni dépendance téléchargée au démarrage (wp-env le fait, ce qui échoue
# sur une connexion instable). Les plugins tiers sont lus depuis .dev-cache/ (voir dev/fetch.sh).
# Identifiants ci-dessous : environnement local jetable, jamais utilisés ailleurs.
name: atelier-mcp

x-wordpress-env: &wordpress-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DB_NAME: wordpress
  # WP_DEBUG est défini par l'image à partir de WORDPRESS_DEBUG.
  WORDPRESS_DEBUG: "1"
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_ENVIRONMENT_TYPE', 'local' );
    define( 'WP_DEBUG_LOG', true );
    define( 'WP_DEBUG_DISPLAY', false );

x-plugins: &plugins
  - wordpress:/var/www/html
  - ..:/var/www/html/wp-content/plugins/atelier-mcp:ro
  - ../.dev-cache/mcp-adapter:/var/www/html/wp-content/plugins/mcp-adapter:ro
  - ../.dev-cache/elementor:/var/www/html/wp-content/plugins/elementor:ro

services:
  db:
    image: mariadb:lts
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 30

  wordpress:
    image: wordpress:php8.2
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8888:80"
    environment: *wordpress-env
    volumes: *plugins

  cli:
    image: wordpress:cli-php8.2
    profiles: ["cli"]
    # Même utilisateur que Apache (uid 33) pour écrire dans le volume partagé.
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wordpress-env
      HOME: /tmp
    volumes: *plugins

volumes:
  wordpress:
  db:
